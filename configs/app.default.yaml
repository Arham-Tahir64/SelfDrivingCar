runtime:
  backend: stub
  tick_hz: 20
  max_ticks: 0
  output_dir: outputs
  log_level: INFO
  record_replay: true
  enable_visualization: true
  weather_preset: ClearNoon
carla:
  host: 127.0.0.1
  port: 2000
  timeout_s: 30.0
  sync_fps: 20
  carla_root: C:\Users\Arham\Desktop\CARLA_0.9.16
  python_api_wheel: C:\Users\Arham\Desktop\CARLA_0.9.16\PythonAPI\carla\dist\carla-0.9.16-cp312-cp312-win_amd64.whl
  launch_executable: C:\Users\Arham\Desktop\CARLA_0.9.16\CarlaUE4.exe
  town: Town04
  ego_vehicle_blueprint: vehicle.tesla.model3
visualization:
  ws_host: "0.0.0.0"
  ws_port: 8765
perception:
  mode: camera_v1
  device: cpu
  model_variant: CarlaObject26.pt
evaluation:
  latency_budget_ms:
    perception: 60
    localization: 5
    mapping: 10
    prediction: 15
    planning: 20
    control: 5

tuning:
  behavior:
    goal_tolerance_m: 6.0
    red_light_approach_distance_m: 30.0
    red_light_stop_distance_m: 12.0
    lead_agent_merge_distance_m: 18.0
    merge_cooldown_ticks: 30
    pedestrian_yield_distance_m: 20.0
    pedestrian_lateral_threshold_m: 3.5
    emergency_vehicle_distance_m: 40.0

  planning:
    horizon_steps: 12
    dt_s: 0.2
    cruise_speed_mps: 12.0

  control:
    stanley_gain: 2.2
    heading_gain: 1.1
    kp_speed: 0.32
    ki_speed: 0.04
    kd_speed: 0.03
    emergency_ttc_s: 1.6
    emergency_gap_m: 6.0

  prediction:
    horizon_s: 5.0
    dt_s: 0.1
    default_lane_speed_mps: 8.0
    velocity_decay_rate: 0.04
    sigma_lat_base: 0.3
    sigma_lat_growth: 0.06
    sigma_lon_base: 0.5
    sigma_lon_growth: 0.12

  perception:
    object_sizes:
      vehicle: [4.5, 2.0, 1.6]
      cyclist: [1.8, 0.8, 1.5]
      pedestrian: [0.8, 0.8, 1.8]
      traffic_light: [0.6, 0.6, 3.0]
    fusion_match_distance_m: 5.0
    lidar:
      cell_size_m: 0.75
      min_cluster_points: 3
      min_range_m: 1.5
      max_range_m: 60.0
      min_height_m: 0.35
      ground_z_threshold_m: -1.5

  perception_aux:
    lane_backend: heuristic
    # Set lane_backend to egolanes_onnx and point egolanes_model_path at your
    # downloaded Autoware EgoLanes ONNX weights to enable the model.
    egolanes_model_path: ""
    egolanes_run_every_n_ticks: 1
    egolanes_confidence_threshold: 0.45
    egolanes_max_input_long_edge_px: 640
