[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomy-demo"
version = "0.1.0"
description = "CARLA autonomy demo scaffold"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
  "jsonschema>=4.23",
  "h5py>=3.11",
  "typing-extensions>=4.12",
]

[project.optional-dependencies]
dev = [
  "black>=24.10",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.11",
  "pre-commit>=3.8",
]
viz = [
  "pygame>=2.6",
  "opencv-python>=4.10",
  "open3d>=0.18",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]
ml = [
  "torch>=2.4",
  "ultralytics>=8.3",
  "onnxruntime>=1.20",
  "opencv-python>=4.10",
  "transformers>=4.45",
  "scipy>=1.14",
]
carla = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_configs = true
mypy_path = "src"
